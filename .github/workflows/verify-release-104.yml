name: Verify public 1.0.4 download
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify anonymous installer download
        shell: python
        run: |
          import hashlib, json, urllib.request
          base = "https://github.com/SRMTJ/HaiTunWorkbench-Releases/releases/download/v1.0.4/"
          def open_public(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "HaiTun-public-download-verification"}), timeout=120)
          with open_public("https://api.github.com/repos/SRMTJ/HaiTunWorkbench-Releases/releases/tags/v1.0.4") as response:
              release = json.load(response)
          assert not release["draft"] and not release["prerelease"]
          with open_public(base + "manifest.json") as response:
              data = response.read()
          assert hashlib.sha256(data).hexdigest() == "d1520759676d06bee8f558cec78e8fcc4f0e5b34daa8859f7f4ec78b0f60e24c"
          manifest = json.loads(data)
          with open_public(base + "manifest.sig") as response:
              signature = response.read()
          assert hashlib.sha256(signature).hexdigest() == "0046205a77a230dc06effa6798fc855bfac096884b7a668e360ae808747fdfd0"
          assert manifest["version"] == "1.0.4" and manifest["platform"] == "windows-amd64"
          size, digest = 0, hashlib.sha256()
          with open_public(base + manifest["file"]) as response:
              while chunk := response.read(4 * 1024 * 1024):
                  size += len(chunk)
                  digest.update(chunk)
          assert size == manifest["size"] == 213302785
          assert digest.hexdigest() == manifest["sha256"] == "d1672153185455419dc3fe60698ab93af7ac2fd5000e5f6febb185af702cd6c2"
          print(json.dumps({"anonymous_full_download": True, "size": size, "sha256": digest.hexdigest(), "signed_files_match_local_verification": True, "stable_release": True}))
